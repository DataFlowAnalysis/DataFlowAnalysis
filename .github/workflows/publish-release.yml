name: Publish Release

on:
  workflow_dispatch:
  release:
    types: [created]
jobs:
  build_and_publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout Maven repo
        uses: actions/checkout@v4
        with:
          repository: DataFlowAnalysis/maven
          ref: gh-pages
          path: maven-repo
          token: ${{ secrets.MAVEN_DEPLOY_TOKEN }}

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Maven
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.9.6

      - name: Set release version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mvn versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false -DprocessAllModules=true

      - name: Check formatting
        run: mvn spotless:check

      - name: Build, Verify and Publish Release
        run: mvn clean deploy -Dstatic.repo.path="${{ github.workspace }}/maven-repo"

      - name: Push to static Maven repo
        working-directory: maven-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Publish ${{ github.ref_name }}"
          git push
